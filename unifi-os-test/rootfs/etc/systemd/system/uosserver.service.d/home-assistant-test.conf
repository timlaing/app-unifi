[Unit]
# Stop the controller before its user bus/delegated cgroups disappear.
Requires=user@1001.service
After=user@1001.service

[Service]
# Override the vendor unit's user only while the fixed wrapper prepares a
# separate namespace. The final service process runs as uosserver, not root.
User=root
Group=root
ExecStart=
ExecStart=/usr/local/bin/unifi-os-rootless-service
