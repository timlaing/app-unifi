[Service]
# The main service needs the updater's Unix socket even without OS upgrades.
# Keep its restart IPC, but prevent downloads and installer filesystem writes.
RestrictAddressFamilies=AF_UNIX
ProtectSystem=strict
ReadWritePaths=/run /var/lib/uosserver/logs
ProtectKernelTunables=yes
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER
ExecStartPre=/bin/bash -c 'test ! -w /var/lib/uosserver/server.conf'
