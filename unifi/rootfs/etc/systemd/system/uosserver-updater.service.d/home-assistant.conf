[Service]
# App-owned override; vendor base unit remains unchanged.
# Permit the vendor's native legacy export; this is a permissions sandbox only.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
ProtectSystem=strict
ReadWritePaths=/run /tmp /lib/unifi/data /var/lib/unifi-os-app/uos/home /var/lib/uosserver/logs
ProtectKernelTunables=yes
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SETUID CAP_SETGID
