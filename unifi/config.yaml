---
name: UniFi OS Server
version: 6.0.0-dev
slug: unifi
description: UniFi OS Server with vendor-native import of the retained Network app
url: https://github.com/timlaing/app-unifi
stage: experimental
breaking_versions:
  - 6.0.0-dev
  - 6.0.0
webui: https://[HOST]:[PORT:11443]
startup: services
arch:
  - aarch64
  - amd64
init: false
tmpfs: false
timeout: 180
backup: cold
map:
  - type: data
    path: /lib/unifi/data
    read_only: false
  - type: backup
    read_only: false
privileged:
  - SYS_ADMIN
devices:
  - /dev/net/tun
# Release blocker: replace this concession with a validated confined profile.
apparmor: false
ports:
  11443/tcp: 8443
  3478/udp: 3478
  5514/udp: 5514
  5671/tcp: null
  6789/tcp: 6789
  8080/tcp: 8080
  8444/tcp: 8843
  8880/tcp: 8880
  8881/tcp: null
  8882/tcp: null
  9543/tcp: null
  10003/udp: 10001
  28082/tcp: null
ports_description:
  11443/tcp: UniFi OS console (legacy host port 8443 by default)
  3478/udp: STUN
  5514/udp: Remote syslog
  5671/tcp: UniFi bundled service
  6789/tcp: UniFi mobile speed test
  8080/tcp: Device inform
  8444/tcp: HTTPS captive portal (legacy host port 8843 by default)
  8880/tcp: HTTP captive portal
  8881/tcp: UniFi bundled service
  8882/tcp: UniFi bundled service
  9543/tcp: Identity Hub
  10003/udp: UniFi OS discovery (legacy host port 10001 by default)
  28082/tcp: UniFi bundled service
options: {}
# Keep existing user settings valid; wiring them to the vendor runtime is a
# release blocker, not permission to silently claim their effects are preserved.
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  memory_max: int?
  memory_init: int?
